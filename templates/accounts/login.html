{% extends "base.html" %}

{% block title %}
Login
{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow">

                <div class="card-header bg-success text-white">
                    <h3 class="mb-0">Login</h3>
                </div>

                <div class="card-body">

                    <form method="post">

                        {% csrf_token %}

                        {{ form.as_p }}

                        <button class="btn btn-success w-100 mt-3">
                            Login
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
