{% extends "base.html" %}

{% block title %}
Delete Calculation
{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="card shadow">

        <div class="card-body text-center">

            <h3>

                Delete this calculation?

            </h3>

            <p>

                This action cannot be undone.

            </p>

            <form method="post">

                {% csrf_token %}

                <button class="btn btn-danger">

                    Delete

                </button>

                <a
                    href="{% url 'history' %}"
                    class="btn btn-secondary">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
