{% if result %}

<div class="card shadow mt-4">

    <div class="card-header bg-dark text-white">

        <h4 class="mb-0">
            Amortization Schedule
        </h4>

    </div>

    <div class="card-body">

        <div class="table-responsive">

            <table class="table table-striped table-hover">

                <thead>

                    <tr>

                        <th>Month</th>
                        <th>EMI</th>
                        <th>Interest</th>
                        <th>Principal</th>
                        <th>Balance</th>

                    </tr>

                </thead>

                <tbody>

                    {% for row in result.schedule %}

                    <tr>

                        <td>{{ row.month }}</td>

                        <td>₹ {{ row.emi }}</td>

                        <td>₹ {{ row.interest }}</td>

                        <td>₹ {{ row.principal }}</td>

                        <td>₹ {{ row.balance }}</td>

                    </tr>

                    {% endfor %}

                </tbody>

            </table>

        </div>

    </div>

</div>

{% endif %}
